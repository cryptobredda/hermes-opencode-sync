name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Source and codec tests (no Hermes or credentials)
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -m unittest discover -s tests -p test_codec.py -v
  hermes-compatibility:
    runs-on: ubuntu-latest
    env:
      HERMES_HOME: ${{ runner.temp }}/hermes-test-home
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: bf0203a794a07aac3ff764972ab9087baa4e4f4e
          path: hermes-sdk
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install pinned Hermes SDK into the disposable CI environment
        run: python -m pip install -e ./hermes-sdk
      - name: Real storage/owner integration tests on synthetic temporary data
        run: python -m unittest discover -s tests -v
